# ============================================================================
#  Quantitative Long/Short Research Engine -- configuracion
#
#  Todo numero que cambia un resultado vive aqui. La terminal pide lo basico
#  (tickers, benchmark, periodo, construccion, capital, costes) y usa estos
#  valores como defaults.
#
#  Este motor NO elige acciones. Recibe una lista LONG y una SHORT de un equipo
#  de research fundamental y mide si esa lista se sostiene cuantitativamente.
# ============================================================================

defaults:
  benchmark: SPY
  lookback: 5y              # 1y | 2y | 3y | 5y | 10y
  risk_free_rate: 0.04      # anual, constante. Ver README: supuesto declarado
  rebalance: monthly        # monthly | quarterly
  construction: risk_parity # equal_weight | inverse_vol | risk_parity | min_variance | max_sharpe
  initial_capital: 1000000
  transaction_cost: 0.0005  # 0.05% por lado sobre el nocional operado
  # Coste de prestamo de los cortos, anual, sobre el nocional corto. No esta en
  # la especificacion original, pero un corto sin coste de prestamo sobrestima
  # el retorno de cualquier cartera long/short. 0.25% es tipico de un nombre
  # "general collateral"; los nombres dificiles de prestar cuestan mucho mas.
  borrow_cost: 0.0025

portfolio:
  gross_exposure: 2.0       # 100% largo + 100% corto
  net_exposure: 0.0         # neutral en dolares
  # |peso| maximo por nombre, sobre capital. NO 20%: con 5 nombres por pata y
  # patas de 100%, 5 x 20% = 100% obliga a que cada nombre valga exactamente
  # 20%, y los cinco metodos de construccion dan la MISMA cartera (se comprobo
  # en la primera corrida: Sharpe, beta y neta identicos en todos). 35% deja
  # libertad real para que los metodos se distingan, y sigue impidiendo que un
  # solo nombre domine su pata.
  max_position: 0.35
  estimation_window_d: 252  # ventana para covarianza y volatilidad al construir
  ewma_lambda: 0.94         # RiskMetrics

# Pesos del Quant Score. Se normalizan a 1. Cada componente es un z-score de
# seccion cruzada con signo tal que MAS ALTO = MAS FAVORABLE PARA UN LARGO.
# La definicion exacta de cada uno esta en src/quant_engine/signals/composite.py.
signal_weights:
  # Mas peso a lo que mas respaldo tiene en la literatura: momentum,
  # fundamentales y revisiones de analistas. value, quality, analyst y
  # short_interest salen de WRDS; sin WRDS quedan vacios y el resto se
  # renormaliza manteniendo sus proporciones.
  momentum: 0.20             # 12-1, 6M, 3M y distancia a medias moviles
  value: 0.15                # rendimientos: beneficio, flujo libre, libros, ventas
  quality: 0.15              # ROE, rentabilidad bruta, margen; deuda y devengo en contra
  analyst: 0.15              # revision de EPS a 3 meses y recomendaciones (IBES)
  risk_adjusted_return: 0.10 # Sharpe de 1 ano
  short_interest: 0.05       # % en corto, invertido (mucho corto = peor)
  volatility: 0.05           # volatilidad anual, invertida (menos = mejor)
  mean_reversion: 0.05       # z-score de 20 dias, invertido (estirado = peor)
  beta: 0.05                 # beta, invertida (anomalia de baja beta, BAB)
  liquidity: 0.025           # log del volumen medio en dolares
  statistical: 0.025         # calidad de tendencia: signo(pendiente) x R2
  # En validacion: se calculan y su IC sale en cada corrida, pero con peso 0 no
  # mueven el score. Subirlos solo si la validacion los respalda fuera de muestra.
  high_52w: 0.0              # precio / maximo de 52 semanas (George-Hwang 2004)
  residual_momentum: 0.0     # momentum 12-1 del residuo frente al mercado (Blitz-Huij-Martens 2011)

# Umbrales de acuerdo entre research y cuantitativo, en unidades de z-score del
# Quant Score ALINEADO: score si el research dice LONG, -score si dice SHORT.
agreement:
  strong: 0.50
  weak: 0.15
  conflict: -0.15            # por debajo de esto, el dato contradice al research

# Clasificacion de regimen de volatilidad: percentil de la vol de 21 dias
# actual dentro de su propia historia.
volatility_regime:
  low: 0.20
  high: 0.80
  extreme: 0.95

# Clasificacion momentum / neutral / reversion a la media.
regime:
  trend_threshold: 0.5       # |z de momentum| minimo para llamar tendencia
  reversion_threshold: 1.5   # |z de precio a 20 dias| para llamar estiramiento

factor_proxies:
  # Factores construidos con ETF reales: rendimiento de la cartera larga menos
  # la de referencia. No se inventa ningun factor fundamental.
  size: [IWM, SPY]
  value: [IWD, IWF]
  momentum: [MTUM, SPY]
  low_volatility: [USMV, SPY]
  quality: [QUAL, SPY]

stress:
  volatility_multipliers: [1.5, 2.0]
  market_shocks: [-0.10, -0.20]
  liquidity_participation: 0.10   # fraccion del volumen diario que se puede operar
  liquidity_spread_multiplier: 3.0

montecarlo:
  n_paths: 10000
  horizon_d: 252
  block_d: 10
  seed: 20260923
  drawdown_thresholds: [0.10, 0.20, 0.30]

robustness:
  lookbacks: [1y, 3y, 5y]
  rebalances: [monthly, quarterly]
  transaction_costs: [0.0005, 0.0015, 0.0030]
  constructions: [equal_weight, inverse_vol, risk_parity, min_variance]
  signal_weight_draws: 500

# Validacion del Quant Score: el mismo score recalculado en cada fin de mes
# pasado, con los datos de ese dia, contra el retorno del mes siguiente (IC de
# rangos). Universo: canasta + scoring.reference_peers, para tener seccion
# cruzada. Analistas e interes corto no tienen historia descargada: quedan
# fuera del score validado y el reporte lo dice. Cuesta ~1 s por mes.
validation:
  enabled: true
  months: 36                 # fines de mes evaluados (los mas recientes)
  horizon_d: 21              # retorno futuro de un mes: fechas mensuales sin solape
  plan_horizon_d: 63         # y al horizonte del plan (solapado, t de Newey-West); 0 lo apaga
  min_names: 20              # nombres minimos con dato en una fecha para contarla

# DCF automatico (FCFF) de cada nombre de la canasta: src/quant_engine/valuation.
# Informa al plan (valor, escenarios, DCF inverso); no cambia veredictos ni el
# Quant Score: un factor de valor por DCF tendria que validarse antes.
valuation:
  enabled: true
  years: 10                  # anos explicitos; el crecimiento converge al terminal en el ultimo
  margin_years: 5            # anos para llegar al margen objetivo
  terminal_growth: 0.025     # nunca por encima de la tasa libre de riesgo
  erp: 0.045                 # prima de riesgo del mercado (implicita de Damodaran, ~4,3-4,6% en 2024-26)
  ronic_excess: 0.0          # RONIC - WACC en el terminal: 0 = el crecimiento perpetuo no crea valor
  sales_to_capital: 5.0      # cada 5 de ventas nuevas exige al menos 1 de reinversion neta
  start_growth_bounds: [-0.20, 0.40]   # sin consenso, el crecimiento del ano 1 sale de la historia acotado
  fair_band: 0.20            # +-20% sobre el precio: valor razonable
  scenario_weights: {bear: 0.25, base: 0.50, bull: 0.25}
  scenario_wacc_shift: 0.01
  scenario_g_shift: 0.005
  marginal_tax: {USD: 0.25, CAD: 0.265, EUR: 0.25, GBP: 0.25, default: 0.25}
  # USD sale del bono a 10 anos (Yahoo ^TNX) en cada corrida; esto es el
  # respaldo. Las demas monedas no tienen serie gratis fiable: revisar cada
  # trimestre (fecha de la ultima revision: 2026-10).
  risk_free: {USD: 0.0425, CAD: 0.032, EUR: 0.026, GBP: 0.045}
  # Supuestos del analista por ticker, encima de los automaticos. Claves:
  # growth (ano 1 o [ano 1, ano 2]), target_margin, terminal_growth, wacc,
  # beta, erp, ronic_excess, da_pct, capex_pct, nwc_pct, sales_to_capital.
  overrides: {}

output:
  directory: output/quant_engine
  charts: true
  open_trade_plan: true      # modo interactivo: abre el informe del plan en el navegador

# Plan de operacion. Ver src/quant_engine/trade_plan.py.
trade_plan:
  stop_atr: 2.5              # stop a 2,5 x ATR(14) de la entrada
  take_profit_r: [1.5, 3.0]  # TP1 y TP2 en multiplos del riesgo R (50% en cada uno)
  max_risk_per_trade: 0.01   # perdida maxima por operacion si salta el stop: 1% del capital
  reduce_size: 0.5           # veredicto REDUCE (senal neutral): mitad de tamano
  flip_threshold: -0.5       # score alineado por debajo: el modelo sugiere el lado contrario
  horizon_d: 63              # horizonte de la tasa base historica (TP antes que stop)
  hedge_beta: true           # cubrir con el benchmark la beta que dejan correcciones y recortes
  hedge_threshold: 0.05      # |beta| del libro por debajo de esto: no se cubre
  hold_band: 0.005           # mismo lado y ajuste menor a 0,5% del capital: HOLD
  # Ir CONTRA research (FLIP) exige que el score haya predicho en este universo:
  # t del IC de la validacion >= este valor. Si no, el FLIP queda NO TRADE.
  # 0 lo desactiva.
  flip_min_ic_t: 2.0
  # FLIP sin esa evidencia: "reduce" lo opera a reduce_size con conviccion LOW
  # (el plan dice como ejecutar el lado contrario); "no_trade" no lo opera.
  unproven_flip: reduce

# Universo de referencia del Quant Score. Se usa cuando la canasta es solo LONG
# o tiene menos de min_cross_section nombres: dentro de una canasta asi no hay
# seccion cruzada que comparar. 50 acciones grandes y liquidas de los 11
# sectores; solo puntuan, nunca entran en la cartera. Sesgo declarado: son
# large caps, asi que una small cap sale con liquidez y tamano en contra.
scoring:
  min_cross_section: 5
  reference_peers: [AAPL, MSFT, NVDA, AVGO, ORCL, CSCO,
                    GOOGL, META, NFLX, DIS,
                    AMZN, HD, MCD, LOW, TJX,
                    PG, KO, PEP, WMT, COST,
                    UNH, JNJ, LLY, MRK, ABT,
                    JPM, BAC, GS, MS, BLK, V, MA,
                    CAT, HON, UNP, GE, RTX, DE,
                    XOM, CVX, COP,
                    NEE, DUK, SO,
                    LIN, SHW, APD,
                    PLD, AMT, EQIX]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sfc-tfsig-portfolio-strategy"
version = "0.1.0"
description = "Modelo multifactor long-only US+Canada para el portafolio conjunto SFC x TFSIG"
requires-python = ">=3.11"

# El nucleo -- panel, factores, cartera, backtest, metricas y validacion -- solo
# necesita pandas y numpy. Es deliberado: son funciones puras sobre DataFrames y
# se prueban con datos sinteticos, sin red. `tomllib` es estandar desde 3.11.
#
# `requests` es para la capa de la SEC. `yfinance` es para precios y se importa
# de forma perezosa dentro de `data/prices.py`.
dependencies = [
    # Techo en 3: con pandas 3.0 fallan 8 tests de backtest e integracion
    # (Series.combine_first y copy-on-write cambian de semantica). Se quita
    # el techo cuando el codigo se adapte, no antes.
    "pandas>=2.2,<3",
    "numpy>=1.26",
    "requests>=2.31",
    "yfinance>=0.2",
]

[project.optional-dependencies]
# Parquet para las caches y el panel. Sin el se cae a CSV comprimido: pierde
# tipos, no pierde datos.
fast = ["pyarrow>=15"]

# Graficos del reporte trimestral. Todo el analisis corre sin ellos.
charts = ["matplotlib>=3.8"]

# Motor long/short de `src/quant_engine` (`python main.py` sin argumentos).
# statsmodels se usa solo por su OLS con errores HAC; ver `quant_engine/_sm.py`
# sobre por que no se importa `statsmodels.api`.
quant = [
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.4",
    "cvxpy>=1.5",
    "clarabel>=0.7",
    "PyYAML>=6",
    "rich>=13",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

# WRDS. NO instalar con `pip install wrds` a secas en Python 3.14: wrds 3.5
# fija pandas<2.3, pandas 2.2 no tiene rueda para 3.14, y pip intenta
# compilarlo y falla pidiendo Visual Studio ("vswhere.exe"). Instalar asi:
#   pip install "psycopg2-binary>=2.9,<2.10" "sqlalchemy>=2,<2.1"
#   pip install wrds --no-deps
# Funciona con pandas 2.3; `pip check` avisara del limite, y es esperado.
wrds = ["psycopg2-binary>=2.9,<2.10", "sqlalchemy>=2,<2.1"]

dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
